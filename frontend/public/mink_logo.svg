<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160">
  <!-- Tail: long curve upward from left of body -->
  <path d="M 48,74 C 36,66 24,50 28,30 C 30,18 40,14 44,22 C 38,28 36,44 46,57 C 52,66 55,74 52,82"
        stroke="#1B2855" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- Body: elongated horizontal mink body (3:1 ratio) -->
  <path d="M 48,70 C 52,54 95,46 145,45 C 172,44 194,52 198,64 C 198,78 190,90 165,94 C 136,97 80,96 58,91 C 44,86 43,80 48,70 Z" fill="#1B2855"/>

  <!-- Neck connection -->
  <path d="M 196,62 C 202,50 215,47 223,54 L 225,72 C 218,80 205,80 197,73 Z" fill="#1B2855"/>

  <!-- Head -->
  <ellipse cx="222" cy="60" rx="23" ry="17" fill="#1B2855"/>

  <!-- Ear -->
  <ellipse cx="212" cy="44" rx="9" ry="11" fill="#1B2855"/>

  <!-- Snout -->
  <path d="M 241,56 C 252,60 254,68 249,73 C 244,78 236,75 234,70 C 238,64 238,58 241,56 Z" fill="#1B2855"/>

  <!-- Back legs -->
  <rect x="66" y="92" width="12" height="28" rx="6" fill="#1B2855"/>
  <rect x="85" y="93" width="12" height="27" rx="6" fill="#1B2855"/>

  <!-- Front legs -->
  <rect x="148" y="92" width="12" height="27" rx="6" fill="#1B2855"/>
  <rect x="165" y="93" width="12" height="26" rx="6" fill="#1B2855"/>

  <!-- Eye -->
  <circle cx="226" cy="52" r="5" fill="white"/>

  <!-- Nose -->
  <circle cx="250" cy="66" r="3" fill="white"/>
</svg>
